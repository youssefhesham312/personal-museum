<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    // Set language and direction before the first paint so an Arabic visitor
    // never sees an English/LTR flash.
    (function () {
      try {
        var stored = window.localStorage.getItem('museum-language');
        var language = stored === 'ar' || stored === 'en'
          ? stored
          : String(navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        document.documentElement.lang = language;
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      } catch (error) {
        /* storage can be blocked; English remains the default */
      }
    })();
  </script>
  <title>Personal Museum</title>
  <meta name="description" content="A personal 3D virtual photo gallery" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
    }

    #overlay.hidden {
      display: none;
    }

    .menu-panel {
      text-align: center;
      color: #e0d6c8;
      font-family: 'Georgia', 'Times New Roman', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Traditional Arabic', serif;
      max-width: 420px;
      padding: 48px 40px;
      background: rgba(20, 18, 15, 0.85);
      border: 1px solid rgba(180, 160, 130, 0.3);
      border-radius: 4px;
    }

    .menu-panel h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #f0e6d6;
    }

    .menu-panel .subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      color: #a09080;
      margin-bottom: 36px;
    }

    .menu-panel button {
      display: block;
      width: 100%;
      padding: 12px 24px;
      margin: 8px 0;
      font-family: 'Georgia', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Traditional Arabic', serif;
      font-size: 15px;
      letter-spacing: 1px;
      border: 1px solid rgba(180, 160, 130, 0.4);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: #e0d6c8;
    }

    .menu-panel button:hover {
      background: rgba(180, 160, 130, 0.15);
      border-color: rgba(180, 160, 130, 0.7);
    }

    .menu-panel button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .menu-panel button:disabled:hover {
      background: transparent;
      border-color: rgba(180, 160, 130, 0.4);
    }

    .menu-panel .photo-count {
      font-size: 13px;
      color: #a09080;
      margin: 16px 0;
      letter-spacing: 1px;
    }

    .menu-panel .upload-status {
      font-size: 12px;
      line-height: 1.55;
      letter-spacing: 0.2px;
      color: #a09080;
      margin: -6px 0 14px;
      min-height: 0;
    }

    .menu-panel .upload-status:empty {
      display: none;
    }

    .menu-panel .upload-status.is-warn {
      color: #e0bf8a;
    }

    .menu-panel .upload-status.is-error {
      color: #e39a8a;
    }

    .menu-panel .mute-btn {
      width: auto;
      display: inline-block;
      padding: 8px 16px;
      font-size: 13px;
      margin-top: 24px;
    }

    /* Hidden file input */
    #file-input { display: none; }

    /* Loading screen */
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 20;
      background: rgba(10, 8, 6, 0.92);
      font-family: 'Georgia', 'Times New Roman', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Traditional Arabic', serif;
      color: #e0d6c8;
    }
    #loading.visible { display: flex; }
    #loading .loading-title {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #a09080;
      margin-bottom: 32px;
    }
    #loading .loading-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(180, 160, 130, 0.2);
      border-top-color: rgba(180, 160, 130, 0.8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading .loading-status {
      margin-top: 24px;
      font-size: 13px;
      letter-spacing: 1px;
      color: #a09080;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="overlay"></div>
  <div id="loading">
    <p class="loading-title" data-i18n="loading.preparing">Preparing Your Exhibition</p>
    <div class="loading-spinner"></div>
    <p class="loading-status" data-i18n="loading.building">Building gallery rooms...</p>
    <button class="loading-cancel" type="button" data-action="cancel" data-i18n="loading.cancel">Cancel</button>
    <p class="loading-error"></p>
    <div class="loading-actions">
      <button type="button" data-action="retry" data-i18n="loading.tryAgain">Try again</button>
      <button type="button" data-action="cancel" data-i18n="loading.backToMenu">Back to menu</button>
    </div>
  </div>
  <audio id="bg-music" preload="none"></audio>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
